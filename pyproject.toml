[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsmith"
version = "0.1.0"
description = "A prompt engineering toolkit — version control, A/B testing, caching, and evaluation for AI prompts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PromptSmith Contributors"},
]
keywords = ["ai", "llm", "prompt-engineering", "claude", "gpt", "testing", "version-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "tabulate>=0.9",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]

[project.scripts]
promptsmith = "promptsmith.cli:main"
ps = "promptsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
